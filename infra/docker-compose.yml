name: nova-pay

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
  networks:
    - backend

x-migration-defaults: &migration-defaults
  restart: "no"
  networks:
    - backend
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: novapay_admin
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in infra/.env}
      POSTGRES_DB: postgres
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?Set ACCOUNT_DB_PASSWORD in infra/.env}
      TRANSACTION_DB_PASSWORD: ${TRANSACTION_DB_PASSWORD:?Set TRANSACTION_DB_PASSWORD in infra/.env}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?Set LEDGER_DB_PASSWORD in infra/.env}
      FX_DB_PASSWORD: ${FX_DB_PASSWORD:?Set FX_DB_PASSWORD in infra/.env}
      PAYROLL_DB_PASSWORD: ${PAYROLL_DB_PASSWORD:?Set PAYROLL_DB_PASSWORD in infra/.env}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?Set ADMIN_DB_PASSWORD in infra/.env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novapay_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - backend

  redis:
    image: redis:8.10.0-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in infra/.env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - backend

  account-migration:
    <<: *migration-defaults
    build:
      context: ..
      dockerfile: services/account-service/Dockerfile
      target: migration
    environment:
      DATABASE_URL: postgresql://account_user:${ACCOUNT_DB_PASSWORD}@postgres:5432/account_db

  transaction-migration:
    <<: *migration-defaults
    build:
      context: ..
      dockerfile: services/transaction-service/Dockerfile
      target: migration
    environment:
      DATABASE_URL: postgresql://transaction_user:${TRANSACTION_DB_PASSWORD}@postgres:5432/transaction_db

  ledger-migration:
    <<: *migration-defaults
    build:
      context: ..
      dockerfile: services/ledger-service/Dockerfile
      target: migration
    environment:
      DATABASE_URL: postgresql://ledger_user:${LEDGER_DB_PASSWORD}@postgres:5432/ledger_db

  fx-migration:
    <<: *migration-defaults
    build:
      context: ..
      dockerfile: services/fx-service/Dockerfile
      target: migration
    environment:
      DATABASE_URL: postgresql://fx_user:${FX_DB_PASSWORD}@postgres:5432/fx_db

  payroll-migration:
    <<: *migration-defaults
    build:
      context: ..
      dockerfile: services/payroll-service/Dockerfile
      target: migration
    environment:
      DATABASE_URL: postgresql://payroll_user:${PAYROLL_DB_PASSWORD}@postgres:5432/payroll_db

  admin-migration:
    <<: *migration-defaults
    build:
      context: ..
      dockerfile: services/admin-service/Dockerfile
      target: migration
    environment:
      DATABASE_URL: postgresql://admin_user:${ADMIN_DB_PASSWORD}@postgres:5432/admin_db

  account-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/account-service/Dockerfile
    image: nova-pay/account-service:0.3.0
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://account_user:${ACCOUNT_DB_PASSWORD}@postgres:5432/account_db
      LEDGER_BASE_URL: http://ledger-service:3003
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in infra/.env}
    expose: ["3001"]
    depends_on:
      account-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  transaction-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/transaction-service/Dockerfile
    image: nova-pay/transaction-service:0.4.0
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://transaction_user:${TRANSACTION_DB_PASSWORD}@postgres:5432/transaction_db
      ACCOUNT_BASE_URL: http://account-service:3001
      LEDGER_BASE_URL: http://ledger-service:3003
      FX_BASE_URL: http://fx-service:3004
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in infra/.env}
      STALE_PROCESSING_MS: "30000"
      RECONCILIATION_INTERVAL_MS: "30000"
    expose: ["3002"]
    depends_on:
      transaction-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3002/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  ledger-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/ledger-service/Dockerfile
    image: nova-pay/ledger-service:0.4.0
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgresql://ledger_user:${LEDGER_DB_PASSWORD}@postgres:5432/ledger_db
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in infra/.env}
      ENABLE_TEST_FUNDING: "false"
    expose: ["3003"]
    depends_on:
      ledger-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3003/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  fx-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/fx-service/Dockerfile
    image: nova-pay/fx-service:0.3.0
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgresql://fx_user:${FX_DB_PASSWORD}@postgres:5432/fx_db
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in infra/.env}
      FX_PROVIDER_MODE: normal
    expose: ["3004"]
    depends_on:
      fx-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3004/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  payroll-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/payroll-service/Dockerfile
    image: nova-pay/payroll-service:0.3.0
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgresql://payroll_user:${PAYROLL_DB_PASSWORD}@postgres:5432/payroll_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ACCOUNT_BASE_URL: http://account-service:3001
      TRANSACTION_BASE_URL: http://transaction-service:3002
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in infra/.env}
      PAYROLL_WORKER_ENABLED: "false"
    expose: ["3005"]
    depends_on:
      payroll-migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3005/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  payroll-worker:
    <<: *service-defaults
    image: nova-pay/payroll-service:0.3.0
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://payroll_user:${PAYROLL_DB_PASSWORD}@postgres:5432/payroll_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ACCOUNT_BASE_URL: http://account-service:3001
      TRANSACTION_BASE_URL: http://transaction-service:3002
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in infra/.env}
      PAYROLL_WORKER_ENABLED: "true"
    depends_on:
      payroll-migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy

  admin-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/admin-service/Dockerfile
    image: nova-pay/admin-service:0.2.0
    environment:
      NODE_ENV: production
      PORT: 3006
      DATABASE_URL: postgresql://admin_user:${ADMIN_DB_PASSWORD}@postgres:5432/admin_db
    expose: ["3006"]
    depends_on:
      admin-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3006/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  gateway:
    image: nginx:1.31.4-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      account-service: { condition: service_healthy }
      transaction-service: { condition: service_healthy }
      ledger-service: { condition: service_healthy }
      fx-service: { condition: service_healthy }
      payroll-service: { condition: service_healthy }
      admin-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - edge
      - backend

networks:
  edge:
  backend:

volumes:
  postgres-data:
  redis-data:
