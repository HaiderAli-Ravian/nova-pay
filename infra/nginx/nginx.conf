worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/json;
  server_tokens off;

  map $http_x_request_id $novapay_request_id {
    default $http_x_request_id;
    "" $request_id;
  }

  upstream account_service { server account-service:3001; }
  upstream transaction_service { server transaction-service:3002; }
  upstream ledger_service { server ledger-service:3003; }
  upstream fx_service { server fx-service:3004; }
  upstream payroll_service { server payroll-service:3005; }
  upstream admin_service { server admin-service:3006; }

  server {
    listen 8080;
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $novapay_request_id;
    proxy_set_header traceparent $http_traceparent;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    location = /health/live {
      add_header Content-Type application/json;
      return 200 '{"status":"ok","service":"api-gateway"}';
    }

    if ($uri ~* "(^|/)internal(/|$)") { return 404; }

    location ~ ^/wallets/[^/]+/transactions(?:/|$) { proxy_pass http://transaction_service; }
    location ^~ /transfers { proxy_pass http://transaction_service; }
    location = /wallets { proxy_pass http://account_service; }
    location /wallets/ { proxy_pass http://account_service; }
    location ^~ /users { proxy_pass http://account_service; }
    location ^~ /fx { proxy_pass http://fx_service; }
    location ^~ /payroll { proxy_pass http://payroll_service; }
    location ^~ /admin { proxy_pass http://admin_service; }

    location = /services/account/health/live { rewrite ^/services/account/(.*)$ /$1 break; proxy_pass http://account_service; }
    location = /services/account/health/ready { rewrite ^/services/account/(.*)$ /$1 break; proxy_pass http://account_service; }
    location ^~ /services/account/docs { rewrite ^/services/account/(.*)$ /$1 break; proxy_pass http://account_service; }
    location = /services/transaction/health/live { rewrite ^/services/transaction/(.*)$ /$1 break; proxy_pass http://transaction_service; }
    location = /services/transaction/health/ready { rewrite ^/services/transaction/(.*)$ /$1 break; proxy_pass http://transaction_service; }
    location ^~ /services/transaction/docs { rewrite ^/services/transaction/(.*)$ /$1 break; proxy_pass http://transaction_service; }
    location = /services/ledger/health/live { rewrite ^/services/ledger/(.*)$ /$1 break; proxy_pass http://ledger_service; }
    location = /services/ledger/health/ready { rewrite ^/services/ledger/(.*)$ /$1 break; proxy_pass http://ledger_service; }
    location ^~ /services/ledger/docs { rewrite ^/services/ledger/(.*)$ /$1 break; proxy_pass http://ledger_service; }
    location = /services/fx/health/live { rewrite ^/services/fx/(.*)$ /$1 break; proxy_pass http://fx_service; }
    location = /services/fx/health/ready { rewrite ^/services/fx/(.*)$ /$1 break; proxy_pass http://fx_service; }
    location ^~ /services/fx/docs { rewrite ^/services/fx/(.*)$ /$1 break; proxy_pass http://fx_service; }
    location = /services/payroll/health/live { rewrite ^/services/payroll/(.*)$ /$1 break; proxy_pass http://payroll_service; }
    location = /services/payroll/health/ready { rewrite ^/services/payroll/(.*)$ /$1 break; proxy_pass http://payroll_service; }
    location ^~ /services/payroll/docs { rewrite ^/services/payroll/(.*)$ /$1 break; proxy_pass http://payroll_service; }
    location = /services/admin/health/live { rewrite ^/services/admin/(.*)$ /$1 break; proxy_pass http://admin_service; }
    location = /services/admin/health/ready { rewrite ^/services/admin/(.*)$ /$1 break; proxy_pass http://admin_service; }
    location ^~ /services/admin/docs { rewrite ^/services/admin/(.*)$ /$1 break; proxy_pass http://admin_service; }

    location / { return 404; }
  }
}
